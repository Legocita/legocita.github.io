<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legocita Makes | Cute Crafts by Carmen</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Georgia, "Times New Roman", serif;
      color: #315c5b;
      text-align: center;
      background:
        radial-gradient(circle at 15% 20%, #ffd9e5 0 8%, transparent 9%),
        radial-gradient(circle at 85% 15%, #d8f1e5 0 10%, transparent 11%),
        radial-gradient(circle at 80% 85%, #ffe8b6 0 11%, transparent 12%),
        linear-gradient(135deg, #fffaf6, #f4fbf8);
    }

    main {
      width: min(760px, 100%);
      padding: 64px 34px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #e9c7bf;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(49, 92, 91, 0.15);
    }

    .sparkle {
      font-size: 32px;
      letter-spacing: 10px;
    }

    h1 {
      margin: 18px 0 4px;
      color: #c25f78;
      font-size: clamp(44px, 9vw, 82px);
      line-height: 1;
    }

    h2 {
      margin: 12px 0 28px;
      color: #507f78;
      font-size: clamp(19px, 4vw, 28px);
      font-weight: normal;
    }

    p {
      max-width: 590px;
      margin: 12px auto;
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.7;
    }

    .coming-soon {
      display: inline-block;
      margin-top: 26px;
      padding: 13px 25px;
      border-radius: 999px;
      color: white;
      background: #c25f78;
      font-family: Arial, sans-serif;
      font-weight: bold;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <main>
    <div class="sparkle">✦ ♡ ✦</div>
    <h1>Legocita Makes</h1>
    <h2>Cute Crafts by Carmen</h2>

    <p>
      Handmade with imagination, color, and heart.
    </p>

    <p>
      Discover unique jewelry, watercolor creations, crochet designs,
      resin art, stationery, and delightful handmade treasures.
    </p>

    <div class="coming-soon">Our full collection is coming soon!</div>
  </main>
</body>
</html>
